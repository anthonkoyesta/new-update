<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How can I help you?</title>
    <!-- Link to CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 Student Task Tracker</h1>
            <p>Keep track of your assignments and daily tasks.</p>
        </header>

        <main>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Enter a new task..." autocomplete="off">
                <button id="addTaskBtn">Add Task</button>
            </div>

            <ul id="taskList" class="task-list">
                <!-- Tasks will be injected here by JavaScript/jQuery -->
            </ul>
            
            <p id="emptyState" class="empty-state">No tasks yet. Add one above!</p>
        </main>

        <footer>
            <p>&copy; 2026 Student Project</p>
        </footer>
    </div>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
